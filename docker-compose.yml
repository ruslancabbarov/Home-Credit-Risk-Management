version: '3.8'

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    container_name: credit-risk-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped

  streamlit:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    container_name: credit-risk-ui
    ports:
      - "8501:8501"
    env_file:
      - .env
    environment:
      - API_URL=http://credit-risk-api:8000
    depends_on:
      - api
    restart: unless-stopped